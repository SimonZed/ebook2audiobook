# podman-compose.yml — universal across cpu / cuda / rocm / xpu (+ jetson),
# on both amd64 and arm64. Pick the accelerator with --profile.
#
#   podman-compose                       --profile cpu    up
#   DEVICE_TAG=cu130    podman-compose   --profile cuda   up
#   DEVICE_TAG=jetson51 podman-compose   --profile jetson up
#   DEVICE_TAG=rocm     podman-compose   --profile rocm   up
#   DEVICE_TAG=xpu      podman-compose   --profile xpu    up
#
# Architecture (amd64 vs arm64) is NOT a profile. It is decided by the host you
# run on plus the matching DEVICE_TAG image — the device entries below are
# arch-agnostic at the compose layer, and there is deliberately no platform: key
# here. ebook2audiobook.command owns the arch: build_docker_image() asks the
# engine for it (podman info / docker version — on a Mac the build happens in the
# VM, so uname -m is the wrong source) and passes it as
#
#   --podman-build-args="--platform linux/<arch> --network=host"
#
# Adding a build.platform key below would make podman see --platform twice, which
# is an error. A build launched by hand instead of through the script gets the
# engine default, which is the host arch.
#
# TAG_SUFFIX exists for the one case the tag cannot express: cross-building both
# arches on the same host (needs qemu-user-static + binfmt), where :cu130 would
# otherwise be overwritten.
#
# Always confirm a profile expands correctly before running it:
#   DEVICE_TAG=rocm podman-compose --profile rocm config

x-common: &common
  image: localhost/athomasson2/ebook2audiobook:${DEVICE_TAG:-cpu}${TAG_SUFFIX:-}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-26.8.7}
      DEVICE_TAG: ${DEVICE_TAG:-cpu}
      # PYTHON_VERSION and DOCKER_DEVICE_STR are the device-critical args: without them
      # the Dockerfile falls back to its cu130 / python3.12 defaults. Build via
      # ebook2audiobook.command so these are exported into the environment.
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
      DOCKER_DEVICE_STR: ${DOCKER_DEVICE_STR:-}
      DOCKER_PROGRAMS_STR: ${DOCKER_PROGRAMS_STR:-curl ffmpeg mediainfo nodejs npm espeak-ng sox tesseract-ocr}
      CALIBRE_INSTALLER_URL: ${CALIBRE_INSTALLER_URL:-https://download.calibre-ebook.com/linux-installer.sh}
      ISO3_LANG: ${ISO3_LANG:-eng}
      INSTALL_RUST: ${INSTALL_RUST:-1}
      # Inert as a build arg unless the Dockerfile declares ARG BUILDAH_FORMAT —
      # ebook2audiobook.command exports BUILDAH_FORMAT=docker, which is what buildah
      # actually reads. Kept here only so the two stay visible together.
      BUILDAH_FORMAT: docker
  working_dir: /app
  entrypoint: ["bash", "ebook2audiobook.command", "--script_mode", "full_docker"]
  tty: true
  stdin_open: true
  ports:
    - "7860:7860"
  security_opt:
    - label=disable
  volumes:
    - ./ebooks:/app/ebooks:rw
    - ./audiobooks:/app/audiobooks:rw
    - ./models:/app/models:rw
    - ./voices:/app/voices:rw
    - ./tmp:/app/tmp:rw
  restart: unless-stopped

services:
  # --- CPU: no device wiring at all -----------------------------------------
  # The only entry that is genuinely both arches; DOCKER_PLATFORM decides.
  ebook2audiobook-cpu:
    <<: *common
    profiles: [cpu]

  # --- NVIDIA discrete (amd64 dGPU, or arm64 SBSA) via CDI -------------------
  # Requires a generated CDI spec on the host:
  #   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
  ebook2audiobook-cuda:
    <<: *common
    profiles: [cuda]
    devices:
      - nvidia.com/gpu=all

  # --- NVIDIA Jetson / Tegra (arm64 L4T) via CSV runtime --------------------
  # Requires mode = "csv" in /etc/nvidia-container-runtime/config.toml and the
  # nvidia runtime registered. On recent JetPack with a generated CDI spec you
  # can use --profile cuda instead of this profile.
  #
  # arm64 only — the jetson* torch wheels have no amd64 build. Enforced in
  # build_docker_image(), which refuses the tag on a non-arm64 host.
  ebook2audiobook-jetson:
    <<: *common
    profiles: [jetson]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    group_add:
      - video

  # --- AMD ROCm -------------------------------------------------------------
  # amd64 only in practice — also enforced in build_docker_image().
  ebook2audiobook-rocm:
    <<: *common
    profiles: [rocm]
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render

  # --- Intel XPU (oneAPI / IPEX) --------------------------------------------
  # amd64 only — also enforced in build_docker_image().
  ebook2audiobook-xpu:
    <<: *common
    profiles: [xpu]
    devices:
      - /dev/dri
    group_add:
      - render
